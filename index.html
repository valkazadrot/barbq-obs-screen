<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BarBQ — экран для OBS</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
    }
    .label {
      position: absolute;
      top: 6.5%;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92vw;
      padding: 16px 44px 19px;
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 22px;
      background: rgba(7, 9, 13, .9);
      box-shadow: 0 8px 0 rgba(0,0,0,.65), 0 0 28px rgba(0,0,0,.7);
      text-align: center;
      white-space: nowrap;
    }
    .label span {
      display: block;
      color: #fff;
      font-family: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif;
      font-size: clamp(42px, 4.2vw, 100px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: .035em;
      -webkit-text-stroke: 2px #101216;
      paint-order: stroke fill;
      text-shadow: 0 3px 0 #101216, 0 0 16px rgba(255,255,255,.25);
    }
  </style>
</head>
<body>
  <div class="label" aria-label="ТЕМП-ХУЕСОС"><span>ТЕМП-ХУЕСОС</span></div>
</body>
</html>
